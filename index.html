<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Kasir & Keuangan Terintegrasi</title>
  
  <!-- Manifest PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">

  <!-- Tailwind CSS & FontAwesome Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Configuration Script -->
  <script src="config.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">

  <!-- Header / Navbar -->
  <header class="bg-blue-600 text-white shadow-md">
    <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
      <h1 class="text-xl font-bold flex items-center gap-2">
        <i class="fa-solid me-2 fa-cash-register"></i> Kasir & Keuangan
      </h1>
      <div id="statusConnection" class="text-xs bg-blue-700 px-2.5 py-1 rounded-full flex items-center gap-1">
        <span class="w-2 h-2 rounded-full bg-green-400 inline-block"></span> Online
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-4xl mx-auto w-full p-4 flex-grow grid grid-cols-1 md:grid-cols-2 gap-4">
    
    <!-- Left Column: Input Form & Scan Nota -->
    <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-4">
      <h2 class="text-lg font-semibold border-b pb-2 text-slate-700 flex items-center gap-2">
        <i class="fa-solid fa-receipt text-blue-600"></i> Input Transaksi / Nota
      </h2>

      <!-- Form Transaksi -->
      <form id="formTransaksi" class="space-y-3">
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Nama Pelanggan / Deskripsi</label>
          <input type="text" id="deskripsi" placeholder="Contoh: Pembelian Sembako - Bpk. Ahmad" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm" required>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Jumlah Nominal (Rp)</label>
          <input type="number" id="nominal" placeholder="0" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm" required>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Kategori</label>
          <select id="kategori" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
            <option value="Pemasukan">Pemasukan (Penjualan)</option>
            <option value="Pengeluaran">Pengeluaran (Operasional)</option>
          </select>
        </div>

        <!-- Tombol Scan / Foto Nota -->
        <div class="pt-2">
          <label class="block text-xs font-medium text-slate-600 mb-1">Upload / Scan Kwitansi Nota</label>
          
          <!-- Hidden File Input -->
          <input type="file" id="inputFotoNota" accept="image/*" capture="environment" class="hidden">
          
          <!-- Trigger Button -->
          <button type="button" id="btnScanNota" class="w-full py-2.5 px-4 bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-300 rounded-lg flex items-center justify-center gap-2 font-medium transition text-sm">
            <i class="fa-solid fa-camera text-blue-600 text-base"></i> Scan / Foto Nota
          </button>
        </div>

        <!-- Preview Area Gambar Nota -->
        <div id="containerPreview" class="hidden relative mt-2 border rounded-lg overflow-hidden bg-slate-50">
          <img id="previewNota" class="w-full h-40 object-cover" src="" alt="Preview Nota">
          <button type="button" id="btnHapusFoto" class="absolute top-2 right-2 bg-red-600 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs shadow">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="btnSimpan" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium shadow-md transition flex items-center justify-center gap-2 text-sm mt-4">
          <i class="fa-solid fa-paper-plane"></i> Simpan & Kirim Nota
        </button>
      </form>
    </div>

    <!-- Right Column: Transaksi Terakhir & Informasi -->
    <div class="space-y-4">
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-lg font-semibold border-b pb-2 text-slate-700 flex items-center gap-2 mb-3">
          <i class="fa-solid fa-clock-rotate-left text-blue-600"></i> Riwayat Transaksi Sesi Ini
        </h2>
        <div id="daftarTransaksi" class="space-y-2 max-h-80 overflow-y-auto text-sm">
          <p class="text-slate-400 text-center py-6 italic">Belum ada transaksi dicatat.</p>
        </div>
      </div>
    </div>
  </main>

  <!-- Notification Toast -->
  <div id="toast" class="fixed bottom-4 right-4 bg-slate-800 text-white px-4 py-3 rounded-lg shadow-lg hidden transition-opacity duration-300 text-sm">
    <span id="toastMessage">Notifikasi</span>
  </div>

  <!-- Client-side Logic Script -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // DOM Elements
      const btnScanNota = document.getElementById('btnScanNota');
      const inputFotoNota = document.getElementById('inputFotoNota');
      const previewNota = document.getElementById('previewNota');
      const containerPreview = document.getElementById('containerPreview');
      const btnHapusFoto = document.getElementById('btnHapusFoto');
      const formTransaksi = document.getElementById('formTransaksi');
      const daftarTransaksi = document.getElementById('daftarTransaksi');
      
      let base64GambarNota = null;

      // 1. Memicu click pada Input File saat Tombol 'Scan Nota' diklik
      if (btnScanNota && inputFotoNota) {
        btnScanNota.addEventListener('click', (e) => {
          e.preventDefault();
          inputFotoNota.click(); // Buka kamera / galeri
        });

        // Event listener saat file terpilih dari kamera/galeri
        inputFotoNota.addEventListener('change', (e) => {
          const file = e.target.files[0];
          if (file) {
            const reader = new FileReader();
            reader.onload = function(evt) {
              base64GambarNota = evt.target.result;
              previewNota.src = base64GambarNota;
              containerPreview.classList.remove('hidden');
              showToast("Foto nota berhasil dimuat!");
            };
            reader.readAsDataURL(file);
          }
        });
      }

      // 2. Hapus foto preview
      btnHapusFoto.addEventListener('click', () => {
        inputFotoNota.value = '';
        base64GambarNota = null;
        previewNota.src = '';
        containerPreview.classList.add('hidden');
      });

      // 3. Penanganan Submit Form Transaksi
      formTransaksi.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const deskripsi = document.getElementById('deskripsi').value;
        const nominal = document.getElementById('nominal').value;
        const kategori = document.getElementById('kategori').value;

        const payload = {
          deskripsi,
          nominal: parseFloat(nominal),
          kategori,
          fotoNota: base64GambarNota,
          tanggal: new Date().toISOString()
        };

        // UI Loading State
        const btnSimpan = document.getElementById('btnSimpan');
        btnSimpan.disabled = true;
        btnSimpan.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Memproses...`;

        try {
          // Kirim data ke endpoint Google Apps Script jika URL terkonfigurasi di config.js
          if (typeof CONFIG !== 'undefined' && CONFIG.API_URL) {
            await fetch(CONFIG.API_URL, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
          }

          // Tambahkan ke UI riwayat transaksi lokal
          tambahRiwayatKeUI(payload);

          // Reset Form
          formTransaksi.reset();
          btnHapusFoto.click();
          showToast("Transaksi berhasil disimpan!");

        } catch (err) {
          console.error("Gagal mengirim data:", err);
          showToast("Terjadi kesalahan saat menyimpan data.");
        } finally {
          btnSimpan.disabled = false;
          btnSimpan.innerHTML = `<i class="fa-solid fa-paper-plane"></i> Simpan & Kirim Nota`;
        }
      });

      // Render Riwayat
      function tambahRiwayatKeUI(data) {
        if (daftarTransaksi.querySelector('p')) {
          daftarTransaksi.innerHTML = '';
        }

        const item = document.createElement('div');
        item.className = 'p-3 bg-slate-50 rounded-lg border border-slate-200 flex justify-between items-center';
        
        const isMasuk = data.kategori === 'Pemasukan';
        const nominalFormatted = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR' }).format(data.nominal);

        item.innerHTML = `
          <div>
            <p class="font-medium text-slate-800">${data.deskripsi}</p>
            <span class="text-xs text-slate-500">${new Date(data.tanggal).toLocaleTimeString('id-ID')}</span>
          </div>
          <div class="text-right">
            <span class="font-bold text-sm ${isMasuk ? 'text-green-600' : 'text-red-600'}">
              ${isMasuk ? '+' : '-'} ${nominalFormatted}
            </span>
          </div>
        `;
        daftarTransaksi.prepend(item);
      }

      // Toast Notifikasi Helper
      function showToast(msg) {
        const toast = document.getElementById('toast');
        document.getElementById('toastMessage').innerText = msg;
        toast.classList.remove('hidden');
        setTimeout(() => toast.classList.add('hidden'), 3000);
      }
    });

    // Register Service Worker untuk PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(err => {
        console.warn('Gagal mendaftarkan ServiceWorker:', err);
      });
    }
  </script>
</body>
</html>
